name: node-image
on: {workflow_dispatch: {}}
permissions: {contents: read, packages: write}
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - run: |
          V=$(cat node/VERSION)
          docker buildx build --platform linux/amd64 --build-arg PM_ARCH=ampere-ada --build-arg CUDA_TAG=12.2.2 --build-arg CUDA_PKG=12-2 -t ghcr.io/nmatare/pearl-node:$V-ampere-ada -f node/Dockerfile --push node
          docker buildx build --platform linux/amd64 --build-arg PM_ARCH=blackwell --build-arg CUDA_TAG=12.8.1 --build-arg CUDA_PKG=12-8 -t ghcr.io/nmatare/pearl-node:$V-blackwell -f node/Dockerfile --push node
